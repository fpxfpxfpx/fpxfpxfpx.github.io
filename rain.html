<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vídeo Loop</title>
    <style>
        body {
            margin: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <video autoplay loop muted controls>
        <source src="VIDEO.mp4" type="video/mp4">
        Seu navegador não suporta vídeo HTML5.
    </video>

</body>
</html>
