<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,600;0,900;1,900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: "Kanit", sans-serif;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* Remove setinhas do input number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body class="bg-[#0f172a] flex min-h-dvh items-center justify-center overflow-hidden text-slate-100">
    <div class="app w-full h-dvh bg-slate-950 flex flex-col max-w-md shadow-2xl border-x border-white/5 relative">

        <header class="bg-slate-900/50 backdrop-blur-md border-b border-white/10 shrink-0">
            <div class="px-6 h-16 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <span class="font-black text-white italic">F</span>
                    </div>
                    <span class="text-lg font-black tracking-tighter uppercase italic">DIARIO<span
                            class="text-blue-500">FF</span></span>
                </div>
            </div>
        </header>

        <main class="flex-1 p-6 overflow-y-auto text-left">
            <div class="mb-6 text-left">
                <a href="index.html"
                    class="flex items-center gap-2 text-slate-500 hover:text-white transition-colors w-fit">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span class="text-[10px] font-black uppercase tracking-widest">Cancelar</span>
                </a>
            </div>

            <h1 class="text-3xl font-black text-white uppercase italic mb-8 leading-none text-left">
                Criar <span class="text-blue-500 text-4xl block">Novo Anúncio</span>
            </h1>

            <div class="mb-8 bg-orange-500/10 border border-orange-500/20 p-4 rounded-2xl flex gap-3 items-start">
                <svg class="w-5 h-5 text-orange-500 shrink-0 mt-0.5" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <div>
                    <h4 class="text-xs font-black uppercase text-orange-500 italic mb-1">Atenção ao Padrão</h4>
                    <p class="text-[11px] text-slate-400 font-semibold leading-tight uppercase">
                        Informações incorretas ou fora do padrão de exemplo resultarão na <span class="text-white">não
                            aprovação</span> do seu post.
                    </p>
                </div>
            </div>

            <form action="postar.php" method="POST" id="formPost" class="space-y-6 text-left pb-12">

                <div class="space-y-4">
                    <div>
                        <label
                            class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 text-left block">Nome
                            da Organização</label>
                        <input type="text" name="nome_org" placeholder="Ex: Spartans Diários" required
                            class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:outline-none focus:border-blue-500/50 transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-3 text-left">
                        <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 block">Seu
                                Nome</label>
                            <input type="text" name="nome_admin" placeholder="Ex: João Silva" required
                                class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:outline-none focus:border-blue-500/50 transition-all">
                        </div>
                        <div>
                            <label
                                class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 block text-left">WhatsApp
                                Contato</label>
                            <input type="tel" name="zap_admin" placeholder="(00) 00000-0000" required
                                class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:outline-none focus:border-blue-500/50 transition-all">
                        </div>
                    </div>
                </div>

                <hr class="border-white/5">

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase ml-1 block text-left">Vaga
                            R$</label>
                        <input type="text" name="vaga" placeholder="0,00" required
                            class="num-format w-full bg-slate-900 border border-white/5 rounded-xl px-2 py-3 text-sm font-bold text-white text-center focus:border-blue-500/50 outline-none">
                    </div>
                    <div>
                        <label
                            class="text-[10px] font-bold text-orange-500 uppercase ml-1 block text-left text-center">Booyah</label>
                        <input type="text" name="booyah" placeholder="0,00" required
                            class="num-format w-full bg-slate-900 border border-white/5 rounded-xl px-2 py-3 text-sm font-bold text-white text-center focus:border-orange-500/50 outline-none">
                    </div>
                    <div>
                        <label
                            class="text-[10px] font-bold text-blue-500 uppercase ml-1 block text-left text-center">Kill</label>
                        <input type="text" name="kill" placeholder="0,00" required
                            class="num-format w-full bg-slate-900 border border-white/5 rounded-xl px-2 py-3 text-sm font-bold text-white text-center focus:border-blue-500/50 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 text-left">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase ml-1 block">Horários</label>
                        <input type="text" name="horarios" placeholder="Ex: 14h, 16h, 18h" required
                            class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:border-blue-500/50 outline-none transition-all">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase ml-1 block">Quedas (Qtd)</label>
                        <input type="number" name="quedas" step="1" min="1" placeholder="3" required
                            class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:border-blue-500/50 outline-none transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 text-left">
                    <div>
                        <label class="text-[10px] font-bold text-blue-400 uppercase ml-1 block">Permite Mobile?</label>
                        <select name="permite_mobile"
                            class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:border-blue-500/50 outline-none appearance-none">
                            <option value="sim" selected>Sim</option>
                            <option value="nao">Não</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-orange-400 uppercase ml-1 block">Permite
                            Emulador?</label>
                        <select name="permite_emulador"
                            class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:border-blue-500/50 outline-none appearance-none">
                            <option value="sim">Sim</option>
                            <option value="nao" selected>Não</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label
                        class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 block text-left">Mapas</label>
                    <input type="text" name="mapas" placeholder="Ex: Bermuda, Purgatório" required
                        class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:border-blue-500/50 outline-none">
                </div>

                <div>
                    <label
                        class="text-[10px] font-bold text-green-500 uppercase tracking-widest ml-1 block text-left">Link
                        do Grupo (WhatsApp Público)</label>
                    <input type="url" name="link" placeholder="https://chat.whatsapp.com/..." required
                        class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:outline-none focus:border-green-500/50 transition-all">
                </div>

                <div>
                    <label
                        class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 block text-left">Informações
                        / Regras</label>
                    <textarea name="regras" rows="3" placeholder="Ex: Sem granada, sem personagens..."
                        class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-sm font-semibold text-white focus:outline-none focus:border-blue-500/50 transition-all resize-none"></textarea>
                </div>

                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white py-5 rounded-2xl shadow-xl shadow-blue-500/30 active:scale-95 transition-all font-black uppercase italic tracking-widest text-sm cursor-pointer">
                        Publicar Agora
                    </button>
                </div>

            </form>
        </main>
    </div>

    <script>
        // Formatação Automática de Moeda (1 -> 1,00)
        document.querySelectorAll('.num-format').forEach(input => {
            input.addEventListener('blur', function () {
                let val = this.value.replace(',', '.');
                if (val !== "" && !isNaN(val)) {
                    this.value = parseFloat(val).toLocaleString('pt-BR', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    });
                }
            });

            // Permite apenas números, ponto ou vírgula enquanto digita
            input.addEventListener('input', function () {
                this.value = this.value.replace(/[^0-9,.]/g, '');
            });
        });
    </script>
</body>

</html>
